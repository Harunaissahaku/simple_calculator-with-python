name: CI/CD Calculator App with Kind

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fixes Node.js 20 warning

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t calculator-app:latest .

      # 5. Tag and push Docker image
      - name: Push Docker image
        run: |
          docker tag calculator-app:latest ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

 
  deploy-kind:
    runs-on: self-hosted
    needs: build-and-push

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # 1. Install Kind directly
      - name: Install Kind
        run: |
          curl -Lo kind https://kind.sigs.k8s.io/dl/v0.21.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          kind version

      # 2. Create a Kubernetes cluster
      - name: Create Kind cluster
        run: kind create cluster --name calculator --wait 60s

      # 3. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kubectl version --client

      # 4. Pull the image built by the previous job
      - name: Pull calculator image
        run: |
          docker pull "${{ secrets.DOCKER_USERNAME }}/calculator-app:latest"

      # 5. Load the image into Kind
      - name: Load Docker image into Kind
        run: |
          kind load docker-image \
            "${{ secrets.DOCKER_USERNAME }}/calculator-app:latest" \
            --name calculator

      # 6. Deploy Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml

      # 7. Wait for deployment
      - name: Wait for calculator deployment
        run: |
          kubectl rollout status deployment/calculator --timeout=120s
          kubectl get pods
          kubectl get services

      # 8. Test the calculator service
      - name: Test Calculator API
        run: |
          kubectl port-forward service/calculator-service 8080:80 &
          PF_PID=$!
          trap 'kill $PF_PID 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -s http://localhost:8080/ >/dev/null; then
              break
            fi
            sleep 2
          done

          curl -f http://localhost:8080/calculate \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{"operation":"add","x":2,"y":3}'
