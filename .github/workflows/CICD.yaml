name: CI/CD Calculator App with Kind

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # fixes Node.js 20 warning

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      # 4. Build Docker image
      - name: Build Docker image
        run: docker build -t calculator-app:latest .

      # 5. Tag and push Docker image
      - name: Push Docker image
        run: |
          docker tag calculator-app:latest ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

  deploy-kind:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      # 1. Checkout code
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up kind (Kubernetes in Docker)
      - name: Set up Kind
        uses: engineerd/setup-kind@v0.6.0
        with:
          version: v0.21.0

      # 3. Load Docker image into kind cluster
      - name: Load Docker image into kind
        run: |
          kind load docker-image ${{ secrets.DOCKER_USERNAME }}/calculator-app:latest

      # 4. Install kubectl
      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/

      # 5. Apply Kubernetes manifests
      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/deployment.yaml --validate=false
          kubectl apply -f k8s/service.yaml --validate=false

      # 6. Wait for pods to be ready
      - name: Wait for calculator pods
        run: |
          kubectl wait --for=condition=ready pod -l app=calculator --timeout=60s

      # 7. Test deployment
      - name: Test Calculator API
        run: |
          # Get NodePort
          PORT=$(kubectl get svc calculator-service -o jsonpath='{.spec.ports[0].nodePort}')
          # Use kind internal cluster IP to test service
          curl "http://localhost:$PORT/calculate" -X POST -H "Content-Type: application/json" \
          -d '{"operation": "add", "x": 2, "y": 3}' || true
